services:

  postgres:
    image: postgres:18.1-trixie
    container_name: postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - ainocraft_network

  redis:
    image: redis:8.4.0
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    env_file:
      - .env
    command: /bin/sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    networks:
      - ainocraft_network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped
    volumes:
      - minio_data:/data
    env_file:
      - .env
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:9000:9000"
    networks:
      - ainocraft_network

  backend:
    build: .
    image: backend:latest
    container_name: backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ainocraft_network

volumes:
  pg_data:
  redis_data:
  minio_data:

networks:
  ainocraft_network:
    name: ainocraft_network
    driver: bridge
